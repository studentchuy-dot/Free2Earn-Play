name: Build Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean Free2Play.spec

      - name: Package portable ZIP
        run: Compress-Archive -Path dist\Free2Play -DestinationPath dist\Free2Play-Windows.zip -CompressionLevel Optimal

      - name: Attach ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Free2Play-Windows.zip
